<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Epipheo Music</title>
    <!-- Epipheo Brand Fonts: Oswald (headings/UI) + Noticia Text (body/headlines) — self-hosted via Manus storage -->
    <style>
      @font-face {
        font-family: 'Oswald';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/manus-storage/oswald-400_ebb1cfc8.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Oswald';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('/manus-storage/oswald-500_d9f25477.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Oswald';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('/manus-storage/oswald-600_1ea619e5.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Oswald';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/manus-storage/oswald-700_f83c9796.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Noticia Text';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/manus-storage/noticia-text-400_47bb81fe.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Noticia Text';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/manus-storage/noticia-text-700_b3f84d59.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Noticia Text';
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url('/manus-storage/noticia-text-400i_beff0ba5.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Noticia Text';
        font-style: italic;
        font-weight: 700;
        font-display: swap;
        src: url('/manus-storage/noticia-text-700i_6abcba2e.ttf') format('truetype');
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
